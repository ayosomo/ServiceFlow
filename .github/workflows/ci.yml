name: local-quality-gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
      - run: docker compose up -d --wait postgres dynamodb azurite firestore
      - run: pnpm db:migrate && pnpm db:seed && pnpm db:test && pnpm db:explain
      - run: pnpm test:integration
      - if: always()
        run: docker compose down -v
# No cloud credentials or automatic deployment. CI execution is not verified until
# this repository is published and a real workflow run succeeds.
