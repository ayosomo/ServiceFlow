openapi: 3.1.0
info:
  title: ServiceFlow Request Approval API
  version: 0.4.0
  description: >-
    Missing requestId generates a canonical REQ-prefixed UUID v4. Legacy four-digit
    IDs remain accepted and are never renumbered. Clients must accept the broader
    response format before a rollout. Handler-generated responses include a server-context x-correlation-id and
    Cache-Control no-store. Caller correlation headers are ignored.
    Gateway/runtime rejections may precede the handler and differ.
    Health is process liveness, not persistence readiness. SDK capacity/contention
    errors are retryable 503s; a 503 mutation can have an uncertain committed outcome.
security: [{ sigv4: [] }]
components:
  securitySchemes:
    sigv4:
      {
        type: apiKey,
        in: header,
        name: Authorization,
        x-amazon-apigateway-authtype: awsSigv4,
      }
  schemas:
    Create:
      type: object
      additionalProperties: false
      required:
        [
          customerId,
          summary,
          ownerTeam,
          priority,
          submittedAt,
          targetAt,
          approvalRequired,
        ]
      properties:
        requestId:
          {
            type: string,
            pattern: "^REQ-([0-9]{4}|[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$",
          }
        customerId: { type: string, pattern: "^SYN-[0-9]{3}$" }
        summary: { type: string, minLength: 5, maxLength: 200 }
        ownerTeam: { type: string, minLength: 1, maxLength: 60 }
        priority: { enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        submittedAt: { type: string, format: date-time }
        targetAt: { type: string, format: date-time }
        approvalRequired: { type: boolean }
    Decision:
      type: object
      additionalProperties: false
      required: [decision, reason, version]
      properties:
        decision: { enum: [APPROVED, REJECTED] }
        reason: { type: string, minLength: 5, maxLength: 500 }
        version: { type: integer, minimum: 1 }
  parameters:
    Idempotency:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 8, maxLength: 100 },
      }
    RequestId:
      {
        name: id,
        in: path,
        required: true,
        schema:
          {
            type: string,
            pattern: "^REQ-([0-9]{4}|[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$",
          },
      }
paths:
  /healthz:
    get:
      responses:
        {
          "200": { description: Redacted liveness },
          "403": { description: Forbidden },
        }
  /requests:
    post:
      parameters: [{ $ref: "#/components/parameters/Idempotency" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Create" } },
          }
      responses:
        {
          "201": { description: Created and persisted },
          "400": { description: Invalid input },
          "403": { description: Forbidden },
          "409": { description: Conflict },
          "503": { description: Persistence unavailable },
        }
  /requests/{id}:
    parameters: [{ $ref: "#/components/parameters/RequestId" }]
    get:
      responses:
        {
          "200": { description: Request and at most 50 recent audit events },
          "403": { description: Forbidden },
          "404": { description: Missing request },
          "503": { description: Persistence unavailable },
        }
  /requests/{id}/decision:
    parameters: [{ $ref: "#/components/parameters/RequestId" }]
    post:
      parameters: [{ $ref: "#/components/parameters/Idempotency" }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Decision" } },
          }
      responses:
        {
          "200": { description: Atomic request and decision audit },
          "400": { description: Invalid input },
          "403":
            { description: Wrong role or submitting principal's own decision },
          "404": { description: Missing request },
          "409": { description: Version, state or idempotency conflict },
          "503":
            {
              description: Persistence or submission audit unavailable; write outcome may be uncertain,
              retry unchanged body and idempotency key,
            },
        }
